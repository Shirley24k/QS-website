<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback - Mortal Combat Your Writing through "Flip Book"</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <section class="hero sustainability-hero">
        <div class="hero-content">
            <h1>Student Feedback on Flip Book</h1>
        </div>
    </section>
    <div id="nav-placeholder"></div>
    <main id="sustainability">
        <div class="sustainability-container">
            <div class="sustainability-list" id="feedback-list">
                <!-- Feedback cards will be dynamically inserted here -->
            </div>
            <button id="load-more-btn" style="display:block;margin:20px auto;">Load More</button>
        </div>
    </main>
    <script>
    const feedbackData = [
        {
            student: "Student 1",
            feedback: "Firstly, the most used learning tool in class is the Flip Book. This is undeniable that Flip Book is more convenience compared to a physical book. This is because students only need to scan the QR code to access the Flip Book instead of carrying a heavy book to school every time during the lesson. Moreover, the Flip Book provides many exercises and explanations which help in improving my understanding. The special thing that I like the most is Flipbook always provides two different essays or texts with the same main ideas. This helps me in making comparisons between them so that I can know which essay presents a better idea. By making a comparison between two different texts or essays, I also learn that elaboration is very important in our essay which makes the reader understand our idea clearly. "
        },
        {
            student: "Student 2",
            feedback: "For learning applications, it is really like an adventure novel and a completely new experience. Sometimes I need to complete tasks within a specific period, which are thrilling and unique. It really helped me train my brain to remember what I had learned, instead of just being boring. I am a person who does not like English, but this was the first time I really enjoyed English lessons so much because it was not just looking at notes anymore. I started to feel I am participating in this class which increased my sense of collaboration and helped improve my writing skills."
        },
        {
            student: "Student 3",
            feedback: "In this writing class I have learned a lot about the academic writing. While it can improve my understanding of writing skills and how to write a good essay. Thus, I will discuss a lot of useful ways in academic writing. Secondly, Flip Book in this course is very useful because it is easy to use and it is convenient. I can use the book anywhere and anytime. It can help me to improve my English skill. Moreover, learning applications can make the class more fun, and it can also let us discuss together. Learning academic writing using a lot of learning applications such as Kahoot, Mentimeter and Vevox can let me remember the important points. In addition, group discussion makes me understand better. This course helps me to improve my writing skill and make me more confident in English. In conclusion, I think this course is very useful for my life."
        }
    ];

    const feedbackList = document.getElementById('feedback-list');
    const loadMoreBtn = document.getElementById('load-more-btn');
    const BATCH_SIZE = 5;
    let currentIndex = 0;

    function renderFeedbackCards(start, count) {
        for (let i = start; i < Math.min(start + count, feedbackData.length); i++) {
            const card = document.createElement('div');
            card.className = 'sustainability-card';
            card.innerHTML = `
                <div class="card-header">
                    <h3>${feedbackData[i].student}</h3>
                </div>
                <div class="card-body">
                    <p>${feedbackData[i].feedback}</p>
                </div>
            `;
            feedbackList.appendChild(card);
        }
    }

    function loadMoreFeedback() {
        renderFeedbackCards(currentIndex, BATCH_SIZE);
        currentIndex += BATCH_SIZE;
        if (currentIndex >= feedbackData.length) {
            loadMoreBtn.style.display = 'none';
        }
    }

    loadMoreBtn.addEventListener('click', loadMoreFeedback);

    // Initial load
    loadMoreFeedback();

    fetch('nav.html')
        .then(res => res.text())
        .then(html => {
            document.getElementById('nav-placeholder').innerHTML = html;
            // Now run the highlight script after nav is loaded
            const links = document.querySelectorAll('#main-nav a');
            const path = window.location.pathname.replace(/\\/g, '/');
            links.forEach(link => {
                if (link.getAttribute('href') === path || (path === '/' && link.getAttribute('href') === '/')) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
